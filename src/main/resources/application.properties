spring.application.name=api

# --- Base de datos (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/tablego?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rq%sj0N*!N7p80ZNVsPd}

# update solo para desarrollo. En produccion usa "validate" + migraciones (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
# El secreto debe tener al menos 32 caracteres. EN PRODUCCION defínelo con la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:g3HqChz*kw5d]*MS2<BaOB?LHmMF_&oKD6QDxI}
app.jwt.expiration=1h
app.jwt.issuer=tablego-api

# --- Usuarios de prueba (admin, recepcionista, cliente). Poner en false en produccion ---
app.seed.enabled=true
